<style>
    :root{--ink:#173049;--muted:#4a5d6b;--line:#d6eaaf;--bg:#f5faea;--primary:#297d53;--primary-2:#007f72;--accent:#92d050;--sand:#ebf5d7;--serif:'DIN Black Alternate','DIN Alternate','Barlow',sans-serif;--surface-container-low:#ebf5d7;--surface-container-lowest:#fff;--inverse-surface:#173049;--inverse-on-surface:#ebf5d7;--on-surface-variant:#4a5d6b}
    body{background:radial-gradient(900px 400px at 100% -50px,rgba(146,208,80,.07),transparent 70%),var(--bg);color:var(--ink);overflow-x:hidden;font-family:'DIN Alternate','DIN Alternate 2014','Barlow',sans-serif;-webkit-font-smoothing:antialiased}
    ::selection{background:var(--accent);color:#fff}
    h1,h2{font-family:var(--serif)!important;font-weight:700!important;letter-spacing:-.015em}
    .topbar{height:68px;position:sticky;top:0;z-index:100;display:flex;align-items:center;justify-content:space-between;padding:0 max(32px,calc((100vw - 1240px)/2));background:rgba(245,250,234,.86);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
    .phb-logo{display:block;width:auto;height:32px;object-fit:contain;flex-shrink:0}
    .brand-divider{width:1px;height:26px;background:#bfdc92;margin:0 4px;flex-shrink:0}
    .brand-mark{width:38px;height:38px;border-radius:12px;background:var(--primary);color:#d6eaaf;display:grid;place-items:center;font-family:var(--serif);font-weight:600;font-size:16px;flex-shrink:0}
    .brand-name{font-family:var(--serif);font-weight:600;font-size:18px;letter-spacing:-.01em}
    #userLabel{padding:7px 14px;border-radius:999px;background:#fff;border:1px solid var(--line);font-size:11px;letter-spacing:.06em}
    .shell{max-width:1240px;margin:0 auto;padding:36px 32px 72px}

    /* welcome */
    .hero-panel{position:relative;overflow:hidden;border-radius:28px;padding:72px 60px 96px;color:#fff;background:radial-gradient(520px 300px at 88% 12%,rgba(146,208,80,.38),transparent 70%),linear-gradient(135deg,#275754,#173049)}
    .hero-panel::after{content:'';position:absolute;right:-90px;bottom:-140px;width:380px;height:380px;border-radius:50%;border:1px solid rgba(255,255,255,.14);box-shadow:0 0 0 54px rgba(255,255,255,.035),0 0 0 108px rgba(255,255,255,.025)}
    .eyebrow{display:inline-flex;align-items:center;gap:8px;padding:7px 14px;border-radius:999px;background:rgba(255,255,255,.12);font-size:10px;font-weight:700;letter-spacing:.18em;text-transform:uppercase}
    .eyebrow::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--accent)}
    .hero-panel h1{font-size:clamp(38px,6vw,64px);line-height:1.04;margin:24px 0 20px;max-width:720px}
    .hero-panel h1 em{color:#92d050;font-style:italic}
    .hero-panel p{color:rgba(255,255,255,.76);font-size:18px;max-width:520px;line-height:1.6;position:relative;z-index:1}
    .role-grid{position:relative;z-index:2;display:grid;grid-template-columns:1fr 1fr;gap:20px;margin:-48px 32px 0}
    .role-card{text-align:left;background:#fff;border:1px solid var(--line);border-radius:22px;padding:30px;transition:transform .25s,box-shadow .25s,border-color .25s;box-shadow:0 12px 30px -18px rgba(23,48,73,.25)}
    .role-card:hover{transform:translateY(-5px);border-color:var(--primary);box-shadow:0 22px 40px -20px rgba(41,125,83,.35)}
    .role-icon{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-family:var(--serif);font-size:17px;font-weight:600;margin-bottom:22px;background:var(--sand);color:var(--primary);transition:.25s}
    .role-card:hover .role-icon{background:var(--primary);color:#fff}
    .arrow-link{color:var(--primary);font-weight:700;font-size:12px;letter-spacing:.08em;text-transform:uppercase;display:inline-flex;align-items:center;gap:8px}
    .arrow-link::after{content:'\2192';font-size:16px;transition:transform .25s}
    .role-card:hover .arrow-link::after{transform:translateX(6px)}
    .login-card{box-shadow:0 30px 60px -30px rgba(41,125,83,.35)}

    /* controls */
    .btn{border-radius:999px;padding:10px 22px;font-weight:600;font-size:14px;transition:all .2s;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px}
    .btn:disabled{opacity:.5;cursor:not-allowed}
    .btn-primary{background:var(--primary);color:#fff;box-shadow:0 6px 16px -8px rgba(41,125,83,.7)}
    .btn-primary:hover:not(:disabled){background:var(--primary-2);transform:translateY(-1px)}
    .btn-ghost{color:var(--ink);border:1.5px solid #bfdc92;background:transparent}
    .btn-ghost:hover:not(:disabled){background:var(--sand);border-color:#92d050}
    .chip{width:32px;height:32px;border-radius:10px;background:var(--primary);color:#d6eaaf;display:grid;place-items:center;flex:none;font-family:var(--serif);font-weight:600;font-size:15px}

    /* surfaces */
    .card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:32px;box-shadow:0 1px 2px rgba(23,48,73,.04),0 14px 30px -20px rgba(23,48,73,.18)}
    .stat-card{position:relative;display:flex;flex-direction:column;align-items:flex-start;text-align:left;padding:22px 24px 24px}
    .stat-card::before{content:'';width:26px;height:4px;border-radius:4px;background:var(--accent);margin-bottom:14px}
    .stat-card span{justify-content:flex-start!important;text-align:left}
    .stat-card strong{font-family:var(--serif);font-size:2.6rem!important;font-weight:600!important;line-height:1}
    .table-card{background:#fff;border:1px solid var(--line);border-radius:20px;overflow-x:auto;box-shadow:0 14px 30px -22px rgba(23,48,73,.25)}
    table{border-collapse:collapse;width:100%}
    th,td{text-align:left;padding:18px 20px;border-bottom:1px solid #e3efcf}
    th{font-size:10.5px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);background:#f6faee;font-weight:700;border-bottom:1px solid var(--line)}
    tbody tr:last-child td{border-bottom:0}
    tbody tr:hover{background:#f1f8e2;cursor:pointer}
    .badge{display:inline-flex;align-items:center;gap:7px;padding:5px 12px 5px 10px;border-radius:999px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;background:var(--sand);color:var(--muted)}
    .badge::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor}
    .badge.submitted{background:#FFF0DB;color:#9A5A12}
    .badge.review{background:#e0e8f5;color:#002060}
    .badge.ready,.badge.approved{background:#d6eaaf;color:#2f5d07}
    .badge.returned{background:#FBE3DF;color:#9B1C12}
    .toast{position:fixed;right:28px;bottom:28px;background:var(--inverse-surface);color:var(--inverse-on-surface);padding:16px 24px;border-radius:16px;opacity:0;transform:translateY(10px);transition:.3s;pointer-events:none;z-index:200;font-size:13px;font-weight:600;box-shadow:0 20px 40px -10px rgba(0,0,0,.35);border-left:4px solid var(--accent)}
    .toast.show{opacity:1;transform:none}

    /* fields */
    .field{display:flex;flex-direction:column;gap:7px}
    .field label{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.09em;color:var(--muted)}
    .field input,.field select,.field textarea{font:inherit;padding:12px 14px;border:1.5px solid #d3e6ad;border-radius:12px;background-color:#fff;width:100%;transition:border-color .2s,box-shadow .2s}
    .field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 4px rgba(41,125,83,.12)}
    .field input[type=file]{padding:9px 12px}
    .field input[type=file]::file-selector-button{border:0;border-radius:999px;padding:7px 14px;margin-right:12px;background:var(--primary);color:#fff;font:inherit;font-size:11px;font-weight:700;cursor:pointer}
    .conditional-field.hidden{display:none}

    /* cost sheets */
    .cost-sheet,.financial-sheet{width:100%;max-width:640px;display:flex;flex-direction:column;gap:10px}
    .cost-row,.financial-row{display:grid;grid-template-columns:minmax(190px,1fr) 16px minmax(180px,230px);align-items:center;gap:10px}
    .cost-label,.financial-label{font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
    .cost-separator,.financial-separator{text-align:center;color:#A39B85;font-weight:700}
    .cost-row .field,.financial-row .field{display:block;width:100%}
    .cost-row .field label,.financial-row .field label{display:none}
    .cost-row input,.financial-row input{text-align:right;width:100%}
    .cost-row>strong{text-align:right;display:block;white-space:nowrap}
    .cost-summary-row{padding:12px 0;border-top:1px dashed #bfdc92}
    .cost-summary-row .cost-label{color:var(--ink)}
    .cost-summary-row strong,.financial-balance strong{text-align:right;display:block;font-size:16px;color:var(--primary);white-space:nowrap}
    .cost-grand-total,.financial-balance{padding:16px 18px;margin-top:4px;background:var(--sand);border:0;border-radius:14px}
    .cost-grand-total strong,.financial-balance strong{font-size:20px;font-family:var(--serif)}
    .financial-balance .financial-label{color:var(--ink)}
    @media(max-width:640px){.cost-row,.financial-row{grid-template-columns:1fr;gap:6px}.cost-separator,.financial-separator{display:none}.cost-summary-row,.cost-grand-total,.financial-balance{grid-template-columns:1fr auto}}
    .mandays-sheet{width:100%;max-width:640px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;align-items:end}
    .mandays-field{min-width:0;display:flex;flex-direction:column;gap:7px}
    .mandays-field label{min-height:30px;font-size:10px;line-height:1.35;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
    .mandays-field input{text-align:right;width:100%;height:44px;padding:9px 12px}
    .mandays-balance-output{width:100%;height:44px;display:flex;align-items:center;justify-content:flex-end;padding:9px 12px;border-radius:12px;background:var(--sand);color:var(--primary);font-size:15px;font-weight:700}
    @media(max-width:760px){.mandays-sheet{grid-template-columns:1fr;gap:16px}}

    /* approval timeline */
    .timeline{list-style:none;padding:0;margin:0}
    .timeline li{position:relative;margin-left:11px;padding:0 0 26px 34px;border-left:2px solid var(--line)}
    .timeline li:last-child{border-left-color:transparent;padding-bottom:0}
    .timeline li::before{content:'';position:absolute;left:-12px;top:-2px;width:22px;height:22px;border-radius:50%;background:#fff;border:2px solid #CFC7B2;display:grid;place-items:center;color:#fff;font-size:11px;font-weight:700}
    .timeline li.done{border-left-color:var(--primary)}
    .timeline li.done::before{content:'\2713';background:var(--primary);border-color:var(--primary)}
    .timeline li.now::before{border-color:var(--accent);background:radial-gradient(circle,var(--accent) 0 4px,#fff 5px);box-shadow:0 0 0 5px rgba(146,208,80,.18)}
    .timeline li strong{font-size:12px;display:block;margin-bottom:4px;font-weight:700;line-height:1.4;color:var(--muted)}
    .timeline li small{font-size:10.5px;color:var(--muted);display:block}
    .timeline li.done strong{color:var(--primary)}
    .timeline li.now strong{color:#55930a}

    /* welcome: split layout, always one screen */
    .welcome-shell{height:calc(100dvh - 68px);min-height:520px;box-sizing:border-box;padding-top:clamp(12px,2.5vh,28px);padding-bottom:clamp(12px,2.5vh,28px)}
    .welcome-grid{height:100%;display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:24px}
    .welcome-grid .hero-panel{display:flex;flex-direction:column;justify-content:center;align-items:flex-start;padding:clamp(28px,5vh,64px) clamp(32px,4vw,64px);min-height:0}
    .welcome-grid .hero-panel h1{font-size:clamp(34px,min(4.6vw,8vh),68px);margin:clamp(14px,3vh,28px) 0 clamp(10px,2.4vh,22px)}
    .welcome-grid .hero-panel p{font-size:clamp(14px,2.1vh,18px)}
    .role-stack{display:flex;flex-direction:column;gap:20px;min-height:0}
    .role-stack .role-card{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;padding:clamp(18px,3.5vh,34px) clamp(22px,2.5vw,36px);box-shadow:0 1px 2px rgba(23,48,73,.04),0 14px 30px -20px rgba(23,48,73,.18)}
    .role-stack .role-icon{margin-bottom:0;width:clamp(38px,6vh,52px);height:clamp(38px,6vh,52px)}
    .role-stack .role-card h2{font-size:clamp(22px,3.6vh,30px);margin-bottom:6px}
    .role-stack .role-card p{margin-bottom:clamp(10px,2.2vh,20px)!important;max-width:100%!important}
    @media(max-width:860px){.welcome-shell{height:auto;min-height:calc(100dvh - 68px)}.welcome-grid{height:auto;grid-template-columns:1fr}.welcome-grid .hero-panel{padding:36px 24px 44px}.role-stack .role-card{flex:none;gap:24px}}
    @media(max-width:860px){.shell{padding:24px 20px 48px}.phb-logo{height:26px;max-width:100px}.brand-divider{height:22px}.brand-name{font-size:15px}.hero-panel{padding:44px 28px 72px;border-radius:22px}.role-grid{grid-template-columns:1fr;margin:-40px 12px 0}}
  </style>
</head>

<img class="phb-logo" src="https://www.phb.com.my/clients/asset_E5316276-9983-47F1-A6C2-76D0C7985656/contentms/img/logo/logo-phb.svg" alt="Pelaburan Hartanah Berhad logo" loading="eager"/>

<script>
    // =====================================================================
    //  CONFIGURATION  -  edit only this block when moving GitHub test -> IIS
    // =====================================================================
    const SHARED = {
      tenantId: 'cc9afa77-5900-4c38-8262-c226c4c2e27d',      // Entra: Directory (tenant) ID
      clientId: '18465953-5262-4a94-a0ac-7ba12b91e364',      // Entra: Application (client) ID of "Training Application Portal"
      flows: {
        submit: 'https://defaultcc9afa7759004c388262c226c4c2e2.7d.environment.api.powerplatform.com:443/powerautomate/automations/direct/cu/23/workflows/57d82c8722c84242852582c590869be2/triggers/manual/paths/invoke?api-version=1',     // TAP-01 Submit Application
        read:   'https://defaultcc9afa7759004c388262c226c4c2e2.7d.environment.api.powerplatform.com:443/powerautomate/automations/direct/cu/10/workflows/3a42cf9b0a974a4e8b5ebad51de26c41/triggers/manual/paths/invoke?api-version=1',     // TAP-02 Read Data
        action: 'https://defaultcc9afa7759004c388262c226c4c2e2.7d.environment.api.powerplatform.com:443/powerautomate/automations/direct/cu/08/workflows/69e9523652a34aaa8636cc728170e374/triggers/manual/paths/invoke?api-version=1'      // TAP-03 Workflow Action
      }
    };
    // Optional per-host overrides (e.g. separate test app registration or test flows).
    const HOST_OVERRIDES = {
      'poduxiptv2021-hash.github.io': {},   // GitHub Pages (testing)
      'localhost': {},                      // local testing
      'training.yourcompany.com': {}        // <- replace with your real IIS host name
    };
    const ENV = Object.assign({}, SHARED, HOST_OVERRIDES[location.hostname] || {});
    // Must match a Redirect URI (type SPA) registered in Entra exactly, including the trailing slash.
    ENV.redirectUri = location.origin + location.pathname.replace(/index\.html$/, '');
    const FLOW_SCOPE = ['https://service.flow.microsoft.com//.default'];
    const ROLE_MAP = { 'Applicant': 'applicant', 'LD Staff': 'ldStaff', 'LD Head': 'ldHead' };
    const ROLE_LABEL = { applicant: 'Applicant', ldStaff: 'L&D Staff', ldHead: 'Head of L&D' };

    // In-memory data. The real data lives in SharePoint and is read/written only through Power Automate.
    let FINAL_APPROVERS = [];   // [{ key, label }]  loaded from the FinalApprovers list (emails stay server-side)
    let APPS = [];              // cache of the last list / detail responses
    let msalApp = null;
    let renderSeq = 0;
    let PREFETCH = null;        // list request started during sign-in, reused once by refreshApps
    let session = JSON.parse(sessionStorage.getItem('taf_session') || 'null');
    let selectedId = null;

    const $ = s => document.querySelector(s);
    const val = id => document.getElementById(id)?.value?.trim() || '';
    const currencyVal = id => Number(val(id).replace(/,/g, '')) || 0;
    const currencyNumber = value => Number(String(value ?? 0).replace(/,/g, '')) || 0;
    const currencyDisplay = value => currencyNumber(value).toLocaleString('en-MY', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

    function setupCurrencyInputs(scope = document) {
      scope.querySelectorAll('input[data-currency="true"]').forEach(input => {
        const showFormatted = () => {
          const numericValue = currencyNumber(input.value);
          input.type = 'text';
          input.inputMode = 'decimal';
          input.value = currencyDisplay(numericValue);
        };
        const enableSpinner = () => {
          const numericValue = currencyNumber(input.value);
          input.type = 'number';
          input.step = '0.05';
          input.min = '0';
          input.value = numericValue.toFixed(2);
          requestAnimationFrame(() => input.select());
        };
        input.addEventListener('focus', enableSpinner);
        input.addEventListener('blur', showFormatted);
        input.addEventListener('change', () => {
          const rounded = Math.round(currencyNumber(input.value) * 20) / 20;
          input.value = rounded.toFixed(2);
          input.dispatchEvent(new Event('input', { bubbles: true }));
        });
        showFormatted();
      });
    }

    const DATA_MIGRATION_KEY = 'taf_status_mapping_v3';
    function canonicalStatus(status) {
      const map = {
        'Submitted': 'Pending HOD Approval',
        'Under HOD Review': 'Pending HOD Approval',
        'HOD Approved': 'Pending L&D Review',
        'Under L&D Review': 'Pending L&D Review',
        'Ready for Further Approval': 'Pending Head of L&D Concurrence',
        'L&D Verified': 'Pending Head of L&D Concurrence',
        'Pending L&D Head Approval': 'Pending Head of L&D Concurrence',
        'Pending Chief Executive Approval': 'Pending Final Approval',

    async function getFlowToken() {
      const account = msalApp && msalApp.getActiveAccount();
      if (!account) throw new Error('Please sign in again.');
      try {
        return (await msalApp.acquireTokenSilent({ scopes: FLOW_SCOPE, account })).accessToken;

    async function callFlow(url, payload) {
      const token = await getFlowToken();
      const graphToken = await getGraphToken();
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), 90000);
      try {
        const res = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token, 'X-Graph-Token': graphToken },
          body: JSON.stringify(payload || {}),
          signal: controller.signal
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok || data.ok === false) {
          const err = new Error(data.message || ('Request failed (' + res.status + ')'));
          err.status = res.status;
          throw err;
        }
        return data;
      } catch (err) {
        if (err.name === 'AbortError') throw new Error('The request timed out. Please try again.');
        if (err instanceof TypeError) throw new Error('Cannot reach the approval service. Check your connection (or CORS settings in the flow).');
        throw err;
      } finally { clearTimeout(timer); }
    }

        e.preventDefault();
        const initialApproverEmail = val('initialApproverEmail').toLowerCase();
        const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        if (!emailPattern.test(initialApproverEmail)) {
          toast('Please enter a valid Head of Department / Division / Company email');
          document.getElementById('initialApproverEmail').focus();
          return;
        }
        const attachmentFile = document.getElementById('attachment').files[0];
        if (!attachmentFile && !(isEdit && existingProgram.attachment && existingProgram.attachment.name)) { toast('Please attach the training brochure / details (required)'); document.getElementById('attachment').focus(); return; }

          toast('Attachment must not exceed 2 MB');
          return;
        }
        const submitBtn = e.submitter || document.querySelector('#appForm button.btn-primary');
        if (submitBtn) submitBtn.disabled = true;
        try {
          let attachment = null;
          if (attachmentFile) {
            const dataUrl = await new Promise((resolve, reject) => {
              const reader = new FileReader();
              reader.onload = () => resolve(reader.result);
              reader.onerror = () => reject(reader.error);
              reader.readAsDataURL(attachmentFile);
            });
            // send only the base64 part (strip "data:...;base64,")
            attachment = { name: attachmentFile.name, type: attachmentFile.type, size: attachmentFile.size, contentBase64: String(dataUrl).split(',')[1] || '' };
          }
          const payload = {
            applicationId: isEdit ? existing.id : '',
            hodEmail: initialApproverEmail,
            participant: { name: val('pName'), employeeNo: val('empNo'), position: val('position'), company: val('company'), department: val('department') },

          toast(err.message || 'Submission failed. Please try again.');
          if (submitBtn) submitBtn.disabled = false;
        }

              </div>

elect></label>

        </div>`;
      const view = { page: 1 };
      const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
      const startOf = x => (x.program && x.program.start) || '';
      const deptOf = x => (x.participant && x.participant.department) || '';
      const costOf = x => ['fee','travel','hotel','others','tax'].reduce((t, k) => t + (Number(x.program && x.program[k]) || 0), 0);
      const escHtml = v => String(v == null ? '' : v).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
      const depts = [...new Set(all.map(deptOf).filter(Boolean))].sort();
      const years = [...new Set(all.map(x => startOf(x).slice(0, 4)).filter(Boolean))].sort().reverse();
      $('#deptFilter').innerHTML = '<option value="">All departments</option>' + depts.map(d => `<option value="${escHtml(d)}">${escHtml(d)}</option>`).join('');

      $('#monthFilter').innerHTML = '<option value="">All months</option>' + MONTHS.map((m, n) => `<option value="${String(n + 1).padStart(2, '0')}">${m}</option>`).join('');
      $('#pageSize').value = sessionStorage.getItem('adminPageSize') || '20';

      function filtered() {
        const source = $('#statusFilter').value === 'all' ? all : a;
        const q = ($('#applicantSearch').value || '').trim().toLocaleLowerCase();
        const d = $('#deptFilter').value, y = $('#yearFilter').value, m = $('#monthFilter').value;
        const list = source.filter(x => {
          const hay = (((x.participant && x.participant.name) || '') + ' ' + (x.id || '') + ' ' + ((x.program && x.program.title) || '')).toLocaleLowerCase();
          const st = startOf(x);
          return (!q || hay.includes(q)) && (!d || deptOf(x) === d) && (!y || st.slice(0, 4) === y) && (!m || st.slice(5, 7) === m);
        });
        const sorts = {
          newest: (p, q2) => (q2.created || '').localeCompare(p.created || ''),
          oldest: (p, q2) => (p.created || '').localeCompare(q2.created || ''),
          trainNew: (p, q2) => startOf(q2).localeCompare(startOf(p)),
          trainOld: (p, q2) => startOf(p).localeCompare(startOf(q2)),
          name: (p, q2) => ((p.participant && p.participant.name) || '').localeCompare((q2.participant && q2.participant.name) || ''),
          cost: (p, q2) => costOf(q2) - costOf(p)
        };
        return list.sort(sorts[$('#sortBy').value] || sorts.newest);
      }
      function draw() {
        const list = filtered();
        const size = Number($('#pageSize').value) || list.length || 1;
        const pages = Math.max(1, Math.ceil(list.length / size));

        const from = (view.page - 1) * size;

    function bindApplicantEditButtons() {
      if (!session || session.role !== 'applicant') return;
      document.querySelectorAll('[data-edit-id]').forEach(button => {
        button.onclick = event => {
          event.preventDefault();
          event.stopPropagation();

          const application = apps().find(item => item.id === id);
          const canEdit = application && application.owner === session.email && canonicalStatus(application.status) === 'Returned to Applicant';
          if (!canEdit) {
            toast('Only your applications returned by L&D can be edited');
            route('applicant');
            return;
          }
          selectedId = id;
          sessionStorage.setItem('selectedId', id);
          route('edit', id);
        };
      });
    }

    function bindApplicantDeleteButtons() {
      if (!session || session.role !== 'applicant') return;
      document.querySelectorAll('[data-delete-id]').forEach(button => {
        button.onclick = async event => {
          event.preventDefault();
          event.stopPropagation();
          const id = button.dataset.deleteId;
          const application = apps().find(item => item.id === id);
          const canDelete = application && application.owner === session.email && canonicalStatus(application.status) === 'Returned to Applicant';
          if (!canDelete) {
            toast('Only your applications returned by L&D can be deleted');
            route('applicant');
            return;
          }
          if (!window.confirm(`Delete application ${id}? This action cannot be undone.`)) return;
          button.disabled = true;
          try { await callFlow(ENV.flows.action, { action: 'delete', id }); }
          catch (err) { toast(err.message || 'Delete failed. Please try again.'); button.disabled = false; return; }
          if (sessionStorage.getItem('selectedId') === id) sessionStorage.removeItem('selectedId');
          if (selectedId === id) selectedId = null;
          toast('Returned application deleted');
          route('applicant');
        };
      });
    }

        doc.setFont('helvetica', 'normal'); doc.setTextColor(23,48,73); doc.setFontSize(6.4);

    function selectWith(label, id, opts, v) {
      return `<div class="field"><label>${label}</label><select id="${id}" class="bg-white text-sm">${opts.map(o => `<option ${o === v ? 'selected' : ''}>${o}</option>`).join('')}</select></div>`;

    function processTracker(x) {
      const stages = [
        '1. Application Submitted',
        '2. Head of Department / Division / Company Approval · via Teams',
        '3. L&D Staff Review & Verification',
        '4. Head of L&D Concurrence',
        `5. Final Approval · via Teams${x.finalApprover && x.finalApprover.label ? ' — ' + x.finalApprover.label : ''}`
      ];
      const status = canonicalStatus(x.status);
      const stateMap = {
        'Pending HOD Approval': { completedThrough: 0, current: 1 },
        'Pending L&D Review': { completedThrough: 1, current: 2 },
        'Pending Head of L&D Concurrence': { completedThrough: 2, current: 3 },
        'Pending Final Approval': { completedThrough: 3, current: 4 },
        'Approved': { completedThrough: 4, current: -1 }
      };
      const state = stateMap[status] || { completedThrough: 0, current: -1 };
      const stopped = status.includes('Returned') || status.includes('Rejected');
      const returnedToLdStaff = status === 'Pending L&D Review' && x.returnRemark && x.returnRemark.to === 'L&D Staff';
      const returnStatus = returnedToLdStaff ? 'Returned to L&D Staff' : status;
      const showReturnNotice = stopped || returnedToLdStaff;
      return `<div class="card !bg-white">
        <h2 class="text-[9px] font-extrabold uppercase tracking-widest text-on-surface-variant mb-6 border-b border-line pb-3">Approval Progress</h2>
        <ol class="timeline">${stages.map((label, i) => {
          const completed = !stopped && i <= state.completedThrough;
          const current = !stopped && i === state.current;
          return `<li class="${completed ? 'active done' : (current ? 'active now' : '')}"><strong>${label}</strong><small>${completed ? 'Completed' : (current ? 'Current stage' : 'Pending')}</small></li>`;
        }).join('')}</ol>
        ${showReturnNotice ? `<div class="mt-4 p-3 bg-error-container text-on-error-container text-xs font-bold">${returnStatus}</div>${x.returnRemark && x.returnRemark.text ? `<p class="mt-2 px-3 text-[10px] text-on-surface-variant leading-relaxed break-words">${x.returnRemark.text}</p>` : ''}` : ''}
      </div>`;
    }

    function workflowActions(x) {
      const actionMap = {
        ldStaff: { status: 'Pending L&D Review', title: 'L&D Verification', primary: 'Verify Sections C, D & E', primaryId: 'ldVerifyBtn', secondary: 'Return to Applicant' },
        ldHead: { status: 'Pending Head of L&D Concurrence', title: 'Head of L&D Concurrence', primary: 'Give Concurrence & Send for Final Approval', primaryId: 'ldConcurBtn', secondary: 'Return to L&D Staff' }
      };
      const cfg = actionMap[session.role];
      if (!cfg || canonicalStatus(x.status) !== cfg.status) return `<section class="card !bg-white"><p class="text-xs text-on-surface-variant">This application is not currently awaiting action from ${session.label}.</p></section>`;
      const approverSelector = session.role === 'ldHead' ? `

          </select>
          <small class="text-[10px] text-on-surface-variant">The selected approver and configured email will be used for the Teams Approval automation.</small>
          <div id="finalApproverError" class="text-[10px] font-bold text-error mt-1"></div>
        </div>` : '';
      return `<section class="card !bg-white border-l-4 border-primary">
        <h2 class="text-lg font-bold mb-2">${cfg.title}</h2>
        <p class="text-xs text-on-surface-variant mb-5">Complete the required review before continuing the approval process.</p>
        ${approverSelector}
        <div class="flex flex-wrap gap-3">
          ${session.role === 'ldStaff' ? '<button type="button" class="btn btn-ghost" id="saveLdBtn">Save</button>' : ''}
          <button type="button" class="btn btn-primary" id="${cfg.primaryId}">${cfg.primary}</button>
          <button type="button" class="btn btn-ghost border-error text-error" id="workflowReturnBtn">${cfg.secondary}</button>
        </div>
      </section>`;
    }

    function bindWorkflowActions(x, a) {
      const currentStatus = canonicalStatus(x.status);
      const isLdEditor = session.role === 'ldStaff' && currentStatus === 'Pending L&D Review';
      const isLdHeadAction = session.role === 'ldHead' && currentStatus === 'Pending Head of L&D Concurrence';
      const actionButtons = () => document.querySelectorAll('#saveLdBtn, #ldVerifyBtn, #ldConcurBtn, #workflowReturnBtn');

      async function runAction(payload, doneMessage) {
        actionButtons().forEach(b => b.disabled = true);
        try {
          await callFlow(ENV.flows.action, Object.assign({ id: x.id }, payload));
          toast(doneMessage);
          route('detail');
        } catch (err) {
          toast(err.message || 'Action failed. Please try again.');
          actionButtons().forEach(b => b.disabled = false);
        }
      }
      function askRemark(promptText) {
        const remark = window.prompt(promptText);
        if (remark === null) return null;
        const cleaned = remark.trim();
        if (!cleaned) { toast('A return remark is required'); return null; }
        return cleaned;
      }
      function pickApprover() {
        const approver = FINAL_APPROVERS.find(item => item.key === val('finalApprover'));
        const error = $('#finalApproverError');
        if (!approver) { if (error) error.textContent = 'Please select a final approver.'; return null; }
        if (error) error.textContent = '';
        return approver;
      }

      if (isLdHeadAction) {
        const concur = $('#ldConcurBtn');
        if (concur) concur.onclick = () => {
          const approver = pickApprover();
          if (!approver) return;
          runAction({ action: 'headConcur', finalApproverKey: approver.key }, `Concurrence given by Head of L&D; forwarded to ${approver.label} through Teams Approvals`);
        };
        const finalApprover = $('#finalApprover');
        if (finalApprover) finalApprover.onchange = () => { const error = $('#finalApproverError'); if (error) error.textContent = ''; };
        const ret = $('#workflowReturnBtn');
        if (ret) ret.onclick = () => {
          const remark = askRemark('Please enter the reason for returning this application to L&D Staff:');
          if (!remark) return;
          runAction({ action: 'headReturn', remark }, 'Returned by Head of L&D to L&D Staff for revision');
        };
        return;
      }

      if (!isLdEditor) return;
      setupCurrencyInputs($('#app'));
      const financialIds = ['approvedBudget', 'expensesToDate', 'totalCost'];
      function updateResidualBalance() {
        if (!isLdEditor) return;
        const residual = currencyVal('approvedBudget') - currencyVal('expensesToDate') - currencyVal('totalCost');
        const display = $('#residualBalanceDisplay');
        if (display) display.textContent = money(residual);
        const hiddenBalance = document.getElementById('balance');
        if (hiddenBalance) hiddenBalance.value = residual.toFixed(2);
      }
      financialIds.forEach(id => { const input = document.getElementById(id); if (input) input.addEventListener('input', updateResidualBalance); });
      const ldCostIds = ['ldFee', 'ldTravel', 'ldHotel', 'ldOthers', 'ldTax'];
      function updateLdCostTotal() { if (!isLdEditor) return; const subtotal=['ldTravel','ldHotel','ldOthers'].reduce((sum,id)=>sum+currencyVal(id),0); const revisedTotal=subtotal+currencyVal('ldFee')+currencyVal('ldTax'); const feeTotalLabel=$('#ldFeeTotal'); if(feeTotalLabel) feeTotalLabel.textContent=money(currencyVal('ldFee')+currencyVal('ldTax')); const subtotalLabel=$('#ldCostSubtotal'); if(subtotalLabel) subtotalLabel.textContent=money(subtotal); const totalLabel = $('#ldCostTotal');
        if (totalLabel) totalLabel.textContent = money(revisedTotal);
        const totalCostField = document.getElementById('totalCost');
        if (totalCostField) { totalCostField.value = revisedTotal.toFixed(2); if (totalCostField.type === 'text') totalCostField.value = currencyDisplay(revisedTotal); }
        updateResidualBalance();
      }
      ldCostIds.forEach(id => { const input = document.getElementById(id); if (input) input.addEventListener('input', updateLdCostTotal); });
      updateLdCostTotal();
      updateResidualBalance();
      function updateMandaysBalance() {
        if (!isLdEditor) return;
        const target = Number(val('targetHours')) || 0;
        const achieved = Number(val('achievedHours')) || 0;
        const balance = Math.round(target - achieved);
        const display = $('#balanceHoursDisplay');
        if (display) display.textContent = String(balance);
        const hiddenBalance = document.getElementById('balanceHours');
        if (hiddenBalance) hiddenBalance.value = String(balance);
      }
      ['targetHours', 'achievedHours'].forEach(id => {
        const input = document.getElementById(id);
        if (input) input.addEventListener('input', updateMandaysBalance);
      });
      updateMandaysBalance();
      function collectLd() {
        return {
          costs: { fee: currencyVal('ldFee'), travel: currencyVal('ldTravel'), hotel: currencyVal('ldHotel'), others: currencyVal('ldOthers'), tax: currencyVal('ldTax') },
          ld: {
            budgetType: val('budgetType'), approvedBudget: currencyVal('approvedBudget'), expensesToDate: currencyVal('expensesToDate'),
            evaluation: val('evaluation'), hrdc: val('hrdc'),
            targetHours: Math.round(Number(val('targetHours')) || 0), achievedHours: Math.round(Number(val('achievedHours')) || 0)
          }
        };   // totals and balances are recalculated by the flow
      }
      const save = $('#saveLdBtn');
      if (save) save.onclick = () => runAction(Object.assign({ action: 'ldSave' }, collectLd()), 'Cost Estimates and Sections D & E saved');
      const verify = $('#ldVerifyBtn');
      if (verify) verify.onclick = () => runAction(Object.assign({ action: 'ldVerify' }, collectLd()), 'Sections C, D & E verified by L&D Staff; forwarded to Head of L&D');
      const ret = $('#workflowReturnBtn');
      if (ret) ret.onclick = () => {
        const remark = askRemark('Please enter the reason for returning this application to the applicant:');
        if (!remark) return;
        runAction(Object.assign({ action: 'ldReturn', remark }, collectLd()), 'Returned by L&D Staff for supplementary information');
      };
    }

    function guard(role) { if (!session || session.role !== role) { route('welcome'); return false; } return true; }
    function guardAdmin() { if (!session || session.role === 'applicant') { route('welcome'); return false; } return true; }

    document.addEventListener('click', e => {
      const r = e.target.closest('[data-route]')?.dataset.route;
      if (r) { e.preventDefault(); route(r); }
    });

    $('#logoutBtn').onclick = () => {
      const account = msalApp && msalApp.getActiveAccount();
      sessionStorage.clear();
      session = null;
      APPS = [];
      if (account) msalApp.logoutRedirect({ account, postLogoutRedirectUri: ENV.redirectUri });
      else route('welcome');
    };

    if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", startApp); else startApp();
  </script>
</body></html>
